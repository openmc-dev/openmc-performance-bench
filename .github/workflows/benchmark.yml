#-----------------------------------------------------------------------------#
# Launch an EC2 instance, run benchmarks, and publish results
#-----------------------------------------------------------------------------#

name: benchmark

on:
  # Manual trigger, optionally targeting a specific OpenMC ref
  workflow_dispatch:
    inputs:
      openmc_ref:
        description: 'OpenMC commit/branch to benchmark (default: develop)'
        required: false
        default: 'develop'

  # Trigger from openmc-dev/openmc via repository_dispatch
  repository_dispatch:
    types: [run-perf]

concurrency:
  group: openmc-performance-benchmark
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  id-token: write

jobs:
  # Spin up an ephemeral EC2 runner
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::882559813539:role/GithubActionsRole
          aws-region: us-east-2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install boto3

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BENCH_APP_ID }}
          private-key: ${{ secrets.BENCH_APP_PRIVATE_KEY }}
          owner: openmc-dev
          repositories: openmc-performance-bench

      - name: Get GitHub runner registration token
        id: reg-token
        run: |
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to get runner token"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Launch EC2 instance
        id: launch
        run: |
          OUTPUT=$(python scripts/launch_ec2_instance.py \
            --runner-token "${{ steps.reg-token.outputs.token }}" \
            --runner-label "perf-ec2" \
            --github-repo "${{ github.repository }}")
          echo "$OUTPUT"
          INSTANCE_ID=$(echo "$OUTPUT" | grep '^instance_id=' | cut -d= -f2)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

  # Run benchmarks on the EC2 runner
  run-benchmarks:
    needs: start-runner
    runs-on: [self-hosted, perf-ec2]
    timeout-minutes: 120
    outputs:
      openmc_sha: ${{ steps.ref.outputs.openmc_sha }}
      failed_benchmarks: ${{ steps.failures.outputs.list }}
    env:
      MOAB_INSTALL_DIR: /opt/software/moab
      DAGMC_INSTALL_DIR: /opt/software/dagmc
      LIBMESH_INSTALL_DIR: /opt/software/libmesh
      PKG_CONFIG_PATH: /opt/software/libmesh/lib/pkgconfig
      OPENMC_CROSS_SECTIONS: /opt/data/endfb-vii.1-hdf5/cross_sections.xml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # ASV needs full history for commit metadata

      - name: Create token to checkout results
        id: results-checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BENCH_APP_ID }}
          private-key: ${{ secrets.BENCH_APP_PRIVATE_KEY }}
          owner: openmc-dev
          repositories: openmc-performance-bench-results

      - name: Clone results repo
        uses: actions/checkout@v6
        with:
          repository: openmc-dev/openmc-performance-bench-results
          path: results-repo
          token: ${{ steps.results-checkout-token.outputs.token }}

      - name: Determine OpenMC ref
        id: ref
        run: |
          REF="${{ github.event.client_payload.sha
               || github.event.inputs.openmc_ref
               || 'develop' }}"
          echo "openmc_ref=$REF" >> "$GITHUB_OUTPUT"

          # Resolve branch/tag/short SHA to a full commit hash so results from
          # this run can be matched exactly and the benchmarked commit is fixed
          SHA=$(curl -sSf \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/openmc-dev/openmc/commits/$REF" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
          echo "Resolved $REF to $SHA"
          echo "openmc_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Add tools and package directories to PATH
        run: |
          echo "/opt/tools-venv/bin" >> "$GITHUB_PATH"
          echo "$MOAB_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          echo "$DAGMC_INSTALL_DIR/bin" >> "$GITHUB_PATH"
          echo "$LIBMESH_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify benchmark dependencies
        run: |
          pkg-config --modversion libmesh
          test -f "$OPENMC_CROSS_SECTIONS"
          echo "Searching for libngcore:"
          find /opt/software -name 'libngcore.so*' -print
          export LD_LIBRARY_PATH="/opt/software/libmesh/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldconfig -p 2>/dev/null | grep libngcore || true

      - name: Register machine with ASV
        id: machine
        run: |
          # Request an IMDSv2 session token from the EC2 metadata service
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" -s)

          # Query the EC2 instance type using the metadata token
          INSTANCE_TYPE=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
            -s http://169.254.169.254/latest/meta-data/instance-type)

          # Use a fixed name that describes the hardware, not the ephemeral hostname
          MACHINE_NAME="ec2-${INSTANCE_TYPE//./-}"
          echo "machine_name=$MACHINE_NAME" >> "$GITHUB_OUTPUT"
          asv machine --yes --machine "$MACHINE_NAME"

      - name: Point ASV results at results repo
        run: |
          mkdir -p results-repo/results
          mkdir -p .asv
          rm -rf .asv/results
          ln -s "${{ github.workspace }}/results-repo/results" "${{ github.workspace }}/.asv/results"

      - name: Run benchmarks
        id: asv-run
        continue-on-error: true
        run: |
          # Only result files written after this time are attributed to this run
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          export LD_LIBRARY_PATH="/opt/software/libmesh/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          PYTHONUNBUFFERED=1 asv run ${{ steps.ref.outputs.openmc_sha }}^! --show-stderr -vv

      - name: Inject metadata into results
        if: steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure'
        run: |
          python scripts/collect_metadata.py \
            --results-dir "results-repo/results/${{ steps.machine.outputs.machine_name }}" \
            --commit "${{ steps.ref.outputs.openmc_sha }}" \
            --since "${{ steps.asv-run.outputs.start }}" \
            --openmc-build-dir .asv/env/*/project/build \
            --dagmc-dir $DAGMC_INSTALL_DIR \
            --moab-dir $MOAB_INSTALL_DIR \
            --libmesh-dir $LIBMESH_INSTALL_DIR

      - name: Summarize failed benchmarks
        id: failures
        if: steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure'
        run: |
          LIST=$(python scripts/summarize_failures.py \
            --results-dir "results-repo/results/${{ steps.machine.outputs.machine_name }}" \
            --commit "${{ steps.ref.outputs.openmc_sha }}" \
            --since "${{ steps.asv-run.outputs.start }}")
          {
            echo "list<<EOF_FAILURES"
            echo "$LIST"
            echo "EOF_FAILURES"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$LIST" ]; then
            {
              echo "## Failed benchmarks"
              echo
              echo "$LIST"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish HTML report
        if: steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure'
        run: |
          if [ -d results-repo/results ]; then
            asv publish --html-dir results-repo/html
          else
            echo "No ASV results found; skipping publish"
          fi

      # Benchmarks run could exceed app token lifetime, so generate another
      - name: Create token for publishing results
        id: results-publish-token
        if: steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BENCH_APP_ID }}
          private-key: ${{ secrets.BENCH_APP_PRIVATE_KEY }}
          owner: openmc-dev
          repositories: openmc-performance-bench-results

      - name: Commit and push results
        if: steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure'
        env:
          RESULTS_TOKEN: ${{ steps.results-publish-token.outputs.token }}
        run: |
          cd results-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || \
            git commit -m "Add benchmark results for ${{ steps.ref.outputs.openmc_sha }}"
          git remote set-url origin \
            "https://x-access-token:${RESULTS_TOKEN}@github.com/openmc-dev/openmc-performance-bench-results.git"
          git push

      - name: Deploy HTML to GitHub Pages
        if: (steps.asv-run.outcome == 'success' || steps.asv-run.outcome == 'failure') && hashFiles('results-repo/html/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.results-publish-token.outputs.token }}
          external_repository: openmc-dev/openmc-performance-bench-results
          publish_branch: gh-pages
          publish_dir: results-repo/html
          keep_files: false

      - name: Fail if any benchmarks failed
        if: steps.asv-run.outcome == 'failure'
        run: exit 1

  # Open (or comment on) a GitHub issue when a benchmark fails so repo watchers
  # are notified.
  notify-failure:
    needs: [start-runner, run-benchmarks]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update benchmark failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENMC_REF: ${{ needs.run-benchmarks.outputs.openmc_sha || github.event.client_payload.sha || github.event.inputs.openmc_ref || 'develop' }}
          FAILED_BENCHMARKS: ${{ needs.run-benchmarks.outputs.failed_benchmarks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL=benchmark-failure
          gh label create "$LABEL" --color d73a4a \
            --description "Automated performance benchmark run failed" --force

          {
            echo "Benchmark run failed for OpenMC commit [\`${OPENMC_REF:0:8}\`](https://github.com/openmc-dev/openmc/commit/${OPENMC_REF})."
            echo
            echo "Workflow run: $RUN_URL"
            echo
            if [ -n "$FAILED_BENCHMARKS" ]; then
              echo "### Failed benchmarks"
              echo
              echo "$FAILED_BENCHMARKS"
            else
              echo "No individual benchmark failures were recorded; the failure occurred elsewhere" \
                   "in the workflow (e.g. EC2 launch, OpenMC build, or publishing). See the run log."
            fi
          } > body.md

          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file body.md
          else
            gh issue create --title "Benchmark failures on OpenMC ${OPENMC_REF:0:8}" \
              --label "$LABEL" --body-file body.md
          fi

  # Always terminate the EC2 instance, even if benchmarks fail
  stop-runner:
    if: always()
    needs: [start-runner, run-benchmarks]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::882559813539:role/GithubActionsRole
          aws-region: us-east-2

      - name: Terminate EC2 instance
        if: needs.start-runner.outputs.instance_id != ''
        run: |
          echo "Terminating ${{ needs.start-runner.outputs.instance_id }}"
          aws ec2 terminate-instances \
            --instance-ids "${{ needs.start-runner.outputs.instance_id }}"
